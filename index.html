
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightLearn | Student Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5ff;color:#202b46}
header{background:#243b80;color:white;padding:22px;text-align:center}
header h1{margin:0}
header p{margin:8px 0 0}
main{max-width:650px;margin:28px auto;padding:16px}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 5px 24px #17255415}
h2{margin-top:0}
label{display:block;margin-top:15px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:7px;border:1px solid #ccd3e3;border-radius:8px;font-size:16px}
button{border:0;background:#3157cf;color:white;padding:13px 18px;border-radius:9px;font-size:16px;cursor:pointer;margin-top:20px}
button:hover{background:#203fa5}
.question{padding:15px 0;border-bottom:1px solid #e5e7eb}
.option{display:block;font-weight:normal;margin:10px 0}
.option input{width:auto;margin-right:8px}
.small{color:#64748b;font-size:14px}
#exam,#result{display:none}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>
<header>
  <h1>🎓 BrightLearn</h1>
  <p>Learn • Practice • Achieve</p>
</header>

<main>
<section class="card" id="login">
  <h2>Student Login</h2>
  <p class="small">Enter your details to start the practice test.</p>
  <form id="loginForm">
    <label for="student">Student name</label>
    <input id="student" required maxlength="80" placeholder="Enter your name">

    <label for="className">Class</label>
    <select id="className" required>
      <option value="">Choose your class</option>
      <option>6</option><option>7</option><option>8</option>
      <option>9</option><option>10</option>
    </select>

    <label for="examCode">Exam code</label>
    <input id="examCode" required placeholder="Enter exam code">

    <button type="submit">Start Test</button>
  </form>
  <p class="small">Demo exam code: BL101</p>
</section>

<section class="card" id="exam">
  <h2 id="welcome"></h2>
  <p class="small">Practice Test • 5 questions</p>
  <form id="examForm">
    <div id="questions"></div>
    <button type="submit">Submit Test</button>
  </form>
</section>

<section class="card" id="result">
  <h2>Test Completed!</h2>
  <p id="studentResult"></p>
  <h3 id="score"></h3>
  <p id="feedback"></p>
  <button onclick="location.reload()">Back to Home</button>
</section>
</main>
<footer>© BrightLearn • Learning for everyone</footer>

<script>
const examCode = "BL101";

const quiz = [
 {q:"Which planet do we live on?",a:["Mars","Earth","Venus","Jupiter"],correct:1},
 {q:"What is 8 × 7?",a:["54","48","56","64"],correct:2},
 {q:"Which is a noun?",a:["Quickly","Beautiful","School","Run"],correct:2},
 {q:"Which organ pumps blood?",a:["Lungs","Heart","Brain","Kidney"],correct:1},
 {q:"What is the chemical formula for water?",a:["CO2","O2","H2O","NaCl"],correct:2}
];

let studentName = "";
let studentClass = "";

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  if(document.getElementById("examCode").value.trim().toUpperCase() !== examCode){
    alert("Incorrect exam code. Please check with your teacher.");
    return;
  }

  studentName = document.getElementById("student").value.trim();
  studentClass = document.getElementById("className").value;

  document.getElementById("login").style.display = "none";
  document.getElementById("exam").style.display = "block";
  document.getElementById("welcome").textContent = "Good luck, " + studentName + "!";

  document.getElementById("questions").innerHTML = quiz.map((item,i)=>`
    <div class="question">
      <strong>${i+1}. ${item.q}</strong>
      ${item.a.map((option,j)=>`
        <label class="option">
          <input type="radio" name="q${i}" value="${j}" required>
          ${option}
        </label>`).join("")}
    </div>`).join("");
});

document.getElementById("examForm").addEventListener("submit", function(e){
  e.preventDefault();
  let score = 0;
  quiz.forEach((item,i)=>{
    const answer = document.querySelector('input[name="q'+i+'"]:checked');
    if(answer && Number(answer.value) === item.correct) score++;
  });

  document.getElementById("exam").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("studentResult").textContent =
    studentName + " • Class " + studentClass;
  document.getElementById("score").textContent =
    "Your score: " + score + " / " + quiz.length;
  document.getElementById("feedback").textContent =
    score >= 4 ? "Excellent work! Keep learning." : "Good effort! Keep practising.";
});
</script>
</body>
</html>
